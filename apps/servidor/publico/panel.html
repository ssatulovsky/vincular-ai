<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E5A47">
<link rel="icon" type="image/png" sizes="32x32" href="/marca/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/marca/favicon-64.png">
<link rel="apple-touch-icon" href="/marca/emblema-180.png">
<link rel="manifest" href="/manifest-panel.webmanifest">
<title>Vincular-IA · Panel del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /*
   * Panel del equipo. Misma familia visual que la tablet (Atkinson Hyperlegible, verde botella),
   * a escala de escritorio. Lo único que destaca es el riesgo: la escala de 4 marcas por persona y
   * la banda roja cuando hay una alerta sin acuse. Todo lo demás es tranquilo y denso.
   */
  :root {
    --fondo: #EEF2EF; --superficie: #FFFFFF; --tinta: #12221B; --tinta-suave: #4A5E55; --linea: #D3DDD7;
    --botella: #1E5A47; --botella-claro: #DCE9E2; --mostaza: #E2A41F;
    --n1: #7A8F3B; --n2: #A35A0C; --n3: #A3121A; --n3-claro: #FBE9EA;
    --radio: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--fondo); color: var(--tinta); font: 16px/1.5 "Atkinson Hyperlegible", Verdana, sans-serif; }
  .oculto { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--mostaza); outline-offset: 2px; }
  a { color: var(--botella); }
  h1 { font-size: 28px; line-height: 1.2; margin: 0; }
  h2 { font-size: 20px; margin: 28px 0 10px; }
  h3 { font-size: 17px; margin: 18px 0 6px; }
  p { margin: 0 0 10px; max-width: 72ch; }
  .suave { color: var(--tinta-suave); }

  /* ── Ingreso ── */
  #ingreso { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  #ingreso form { width: min(420px, 100%); background: var(--superficie); border-radius: var(--radio); padding: 32px; border: 1px solid var(--linea); }
  #ingreso h1 { margin-bottom: 6px; }
  #ingreso p { margin-bottom: 22px; }

  /* ── Estructura ── */
  #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
  nav { background: var(--botella); color: #fff; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  nav .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 19px; padding: 0 10px 18px; }
  nav .marca img, .logo-ingreso img { border-radius: 22%; }
  .logo-ingreso { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; font-weight: 700; font-size: 22px; }
  /* "IA" en el ámbar del logo, con contraste suficiente sobre cada fondo. */
  .logo-ingreso b { color: #A8641C; }
  nav .marca b { color: #F2B36B; }
  nav button { background: none; border: 0; color: #fff; text-align: left; padding: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  nav button[aria-current="page"] { background: rgba(255,255,255,.16); font-weight: 700; }
  nav button:hover { background: rgba(255,255,255,.1); }
  nav .contador { background: var(--n3); color: #fff; border-radius: 999px; min-width: 24px; padding: 0 7px; font-size: 13px; font-weight: 700; text-align: center; }
  nav .quien { margin-top: auto; padding: 10px; font-size: 14px; border-top: 1px solid rgba(255,255,255,.2); }
  nav .quien span { display: block; opacity: .8; }
  nav .quien button { padding: 6px 0; text-decoration: underline; }
  main { padding: 28px 36px 80px; min-width: 0; }
  .cabeza { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }

  /* ── Controles ── */
  .boton { border: 2px solid var(--botella); background: var(--botella); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
  .boton.sec { background: var(--superficie); color: var(--botella); }
  .boton.peligro { border-color: var(--n3); background: var(--superficie); color: var(--n3); }
  .boton.chico { padding: 4px 10px; font-size: 14px; }
  .boton:disabled { opacity: .5; cursor: default; }
  label { display: block; font-weight: 700; margin: 12px 0 4px; }
  label .suave { font-weight: 400; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=datetime-local], input[type=search], input[type=number], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid #A9B8B0; border-radius: 8px; background: #fff;
  }
  textarea { min-height: 90px; resize: vertical; }
  input[readonly], textarea[readonly] { background: #F5F7F6; }
  .fila { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 16px; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 6px 0; }
  .error { color: var(--n3); font-weight: 700; min-height: 1.5em; margin: 8px 0 0; }
  .ok { color: var(--botella); font-weight: 700; }
  .buscar { max-width: 320px; }

  /* ── Tablas ── */
  .tabla { width: 100%; border-collapse: collapse; background: var(--superficie); border-radius: var(--radio); overflow: hidden; border: 1px solid var(--linea); }
  .tabla th { text-align: left; font-size: 14px; color: var(--tinta-suave); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--linea); background: #F7F9F8; }
  .tabla td { padding: 11px 12px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  .tabla tr:last-child td { border-bottom: 0; }
  .tabla tbody tr.clic { cursor: pointer; }
  .tabla tbody tr.clic:hover { background: #F4F8F6; }
  .tabla tr.pendiente td:first-child { box-shadow: inset 5px 0 0 var(--n3); }
  .vacio { background: var(--superficie); border: 1px dashed #A9B8B0; border-radius: var(--radio); padding: 24px; color: var(--tinta-suave); }

  /* Escala de riesgo: 4 marcas (0 a 3), se llenan hasta el nivel. */
  .escala { display: inline-flex; gap: 3px; vertical-align: middle; }
  .escala i { width: 9px; height: 18px; border-radius: 2px; background: var(--linea); }
  .escala[data-n="1"] i:nth-child(-n+2) { background: var(--n1); }
  .escala[data-n="2"] i:nth-child(-n+3) { background: var(--n2); }
  .escala[data-n="3"] i { background: var(--n3); }
  .escala[data-n="0"] i:first-child { background: #8FA89B; }
  .nivel { display: inline-block; font-weight: 700; border-radius: 6px; padding: 1px 8px; font-size: 14px; color: #fff; }
  .nivel[data-n="1"] { background: var(--n1); } .nivel[data-n="2"] { background: var(--n2); } .nivel[data-n="3"] { background: var(--n3); }
  .estado { font-size: 14px; padding: 1px 8px; border-radius: 6px; background: var(--botella-claro); white-space: nowrap; }
  .estado[data-e="pausada"], .estado[data-e="onboarding"] { background: #F3E6C7; }
  .estado[data-e="baja"] { background: #E3E3E3; }
  .aviso { color: var(--n2); font-weight: 700; }

  /* ── Ficha ── */
  .volver { background: none; border: 0; color: var(--botella); cursor: pointer; padding: 0; margin-bottom: 10px; text-decoration: underline; }
  .datos-cabeza { color: var(--tinta-suave); margin-top: 4px; }
  .pestanas { display: flex; gap: 2px; border-bottom: 2px solid var(--linea); margin: 18px 0 20px; flex-wrap: wrap; }
  .pestanas button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--tinta-suave); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .pestanas button[aria-selected="true"] { color: var(--tinta); font-weight: 700; border-bottom-color: var(--botella); }
  .bloque { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px 22px; margin-bottom: 16px; }
  .bloque > h2:first-child, .bloque > h3:first-child { margin-top: 0; }
  .lista-simple { list-style: none; padding: 0; margin: 0; }
  .lista-simple li { padding: 10px 0; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .lista-simple li:last-child { border-bottom: 0; }
  .qr { display: block; width: 260px; max-width: 100%; height: auto; margin: 8px auto 12px; background: #fff; border-radius: 8px; }
  .codigo { font-size: 22px; font-weight: 700; letter-spacing: .5px; background: var(--botella-claro); padding: 12px 14px; border-radius: 8px; word-break: break-all; user-select: all; }
  .umbral { display: grid; grid-template-columns: 2fr 110px 2fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .turno { padding: 10px 12px; border-radius: 8px; margin: 6px 0; max-width: 80ch; }
  .turno.persona { background: var(--botella-claro); }
  .turno.agente { background: #F4F4F0; }
  .turno small { display: block; color: var(--tinta-suave); }
  .fragmento { background: var(--n3-claro); border-left: 4px solid var(--n3); padding: 10px 14px; margin: 10px 0; white-space: pre-wrap; }
  .privado { font-size: 13px; background: #EEE3F5; border-radius: 6px; padding: 0 6px; }

  /* Resumen de sesión: observado e inferido lado a lado; lo inferido, en cursiva (es tentativo). */
  dialog.ancho { width: min(980px, 96vw); }
  .informe h3 { margin-top: 22px; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .dos h4 { font-size: 14px; color: var(--tinta-suave); margin: 4px 0; font-weight: 700; }
  .dos ul, .informe ul { margin: 0 0 6px; padding-left: 18px; }
  .dos li, .informe li { margin: 3px 0; }
  .inferido { font-style: italic; }
  .cita { color: var(--botella); }
  .lectura { border-left: 4px solid var(--botella); padding: 6px 12px; margin: 8px 0; background: #F7F9F8; }
  .lectura .tipo { font-size: 13px; font-weight: 700; color: var(--tinta-suave); }
  .nota-lentes { font-size: 14px; color: var(--tinta-suave); }
  .lentes-opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 16px; }
  @media (max-width: 820px) { .dos { grid-template-columns: 1fr; } }

  /* Evolución: gráficos pequeños de una sola serie; uso y contacto humano lado a lado, nunca en doble eje. */
  .graficos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .grafico { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px 8px; }
  .grafico h3 { margin: 0 0 2px; font-size: 16px; }
  .grafico p { font-size: 13px; color: var(--tinta-suave); margin: 0 0 6px; }
  .grafico svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grafico .eje { stroke: var(--linea); stroke-width: 1; }
  .grafico .base { stroke: var(--tinta-suave); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .grafico text { font: 12px "Atkinson Hyperlegible", Verdana, sans-serif; fill: var(--tinta-suave); }
  .grafico .marca { fill: var(--botella); }
  .grafico .marca:hover, .grafico .marca:focus { fill: #143E31; outline: none; }
  .grafico .linea { fill: none; stroke: var(--botella); stroke-width: 2; }
  #tooltip { position: fixed; pointer-events: none; background: var(--tinta); color: #fff; font-size: 13px; padding: 5px 9px; border-radius: 6px; z-index: 10; }
  .bandera { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 6px; padding: 0 7px; margin-left: 6px; background: #F3E6C7; color: #6B4306; white-space: nowrap; }
  .aviso-bloque { border-left: 5px solid var(--n2); background: #FBF3E4; padding: 12px 16px; border-radius: 0 var(--radio) var(--radio) 0; margin-bottom: 16px; }

  dialog { border: 0; border-radius: var(--radio); padding: 26px 28px; width: min(620px, 94vw); max-height: 90vh; box-shadow: 0 18px 60px rgba(18,34,27,.3); }
  dialog::backdrop { background: rgba(18,34,27,.45); }
  dialog h2 { margin-top: 0; }

  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; }
    nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; }
    nav .marca { padding: 0 10px; }
    nav .quien { margin: 0 0 0 auto; border: 0; }
    main { padding: 20px 16px 60px; }
    .tabla .opcional { display: none; }
    .umbral { grid-template-columns: 1fr; }
  }
  /* Celular: menú compacto en una franja deslizable y tablas que se desplazan en vez de cortarse. */
  @media (max-width: 600px) {
    nav { gap: 4px; padding: 10px 8px; flex-wrap: nowrap; overflow-x: auto; }
    nav .marca { font-size: 17px; padding: 0 6px; flex: none; }
    nav .marca span { display: none; }
    nav button { flex: none; white-space: nowrap; padding: 8px 10px; }
    nav .quien { flex: none; margin: 0 0 0 auto; padding: 0; }
    nav .quien strong, nav .quien #quien-rol { display: none; }
    main { padding: 14px 12px 60px; }
    .tabla { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .cabeza { flex-wrap: wrap; gap: 10px; }
    .pestanas { overflow-x: auto; flex-wrap: nowrap; }
    .pestanas button { flex: none; }
    .chequeo { grid-template-columns: 70px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .chequeos { list-style: none; padding: 0; margin: 0; }
  .chequeo { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid #E3E9E5; }
  .chequeo:first-child { border-top: 0; }
  .chequeo .marca { align-self: start; text-align: center; font-weight: 700; font-size: 14px; border-radius: 999px; padding: 4px 0; }
  .chequeo[data-e="ok"] .marca { background: #DCEFE3; color: #1E5A47; }
  .chequeo[data-e="falta"] .marca { background: #F8E1DD; color: #8A1C12; }
  .chequeo[data-e="revisar"] .marca { background: #FBF0D9; color: #7A4A0E; }
  .fila-tarea { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
  .fila-tarea input[type=text] { flex: 1 1 220px; }
  .enlace { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: #1E5A47; text-decoration: underline; cursor: pointer; }
  .aviso-requisitos { border-left: 5px solid #A8641C; background: #FBF3E6; }
  .casilla { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 6px 0; }
  .casilla input { margin-top: 4px; width: auto; }
  fieldset.criterios { border: 1px solid #D5DED8; border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
</style>
</head>
<body>

<section id="ingreso" class="oculto">
  <form id="form-ingreso">
    <div class="logo-ingreso"><img src="/marca/emblema-96.png" width="56" height="56" alt=""><span>Vincular-<b>IA</b></span></div>
    <h1>Panel del equipo</h1>
    <p class="suave">Ingrese con la cuenta que le entregó el equipo de Vincular-IA.</p>
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="contrasena">Contraseña</label>
    <input id="contrasena" type="password" autocomplete="current-password" required>
    <div class="acciones"><button class="boton" type="submit">Ingresar</button></div>
    <p class="error" id="error-ingreso" role="alert"></p>
  </form>
</section>

<div id="app" class="oculto">
  <nav aria-label="Secciones">
    <div class="marca"><img src="/marca/emblema-96.png" width="32" height="32" alt=""><span>Vincular-<b>IA</b></span></div>
    <button type="button" data-vista="pacientes">Pacientes</button>
    <button type="button" data-vista="alertas" id="nav-alertas">Alertas <span class="contador oculto" id="contador-alertas"></span></button>
    <button type="button" data-vista="equipo" id="nav-equipo" class="oculto">Equipo</button>
    <button type="button" data-vista="preparacion" id="nav-preparacion" class="oculto">Preparación del piloto</button>
    <div class="quien"><strong id="quien-nombre"></strong><span id="quien-rol"></span><button type="button" id="salir">Salir</button></div>
  </nav>
  <main id="contenido" tabindex="-1"></main>
</div>

<div id="tooltip" class="oculto" role="status"></div>
<dialog id="dialogo"><form method="dialog" id="dialogo-form"></form></dialog>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const CLAVE = 'vincular.tokenEquipo';
  const leer = () => { try { return sessionStorage.getItem(CLAVE); } catch { return null; } };
  const guardar = (v) => { try { v ? sessionStorage.setItem(CLAVE, v) : sessionStorage.removeItem(CLAVE); } catch {} };
  let token = leer();
  let yo = null;

  const ROLES = { supervisor_clinico: 'Psicólogo/a supervisor/a', psiquiatra: 'Psiquiatra', enfermera_enlace: 'Enfermera/o de enlace', gerontologo: 'Gerontólogo/a', guardia: 'Guardia clínica', admin_plataforma: 'Administración' };
  const ESTADOS = { onboarding: 'En incorporación', activa: 'Activa', pausada: 'Pausada', baja: 'De baja' };
  const CAPAS = { biografica: 'Biografía', relacional: 'Personas importantes', salud: 'Salud', preferencias: 'Preferencias', episodica: 'Conversaciones' };
  const ORIGEN = { modelo: 'compañero', modelo_regenerado: 'compañero (corregido por el guardián)', respuesta_segura: 'respuesta segura', protocolo_emergencia: 'protocolo de emergencia', persona: 'persona' };
  const LENTES = {
    pichon_adaptacion: 'Pichon-Rivière: adaptación a la realidad', pichon_vinculo_roles: 'Pichon-Rivière: vínculo y roles', pichon_ansiedades: 'Pichon-Rivière: ansiedades y cambio',
    pichon_cono_invertido: 'Pichon-Rivière: cono invertido', freud: 'Freud', klein: 'Klein', lacan: 'Lacan', winnicott: 'Winnicott', bowlby_erikson: 'Bowlby y Erikson', transferencia: 'Transferencia hacia el compañero',
  };
  const SECCIONES_INFORME = [['estado_afectivo', 'Estado afectivo'], ['pensamientos_creencias', 'Pensamientos y creencias'], ['funcionamiento_cotidiano', 'Funcionamiento cotidiano'], ['red_social', 'Red social'], ['salud', 'Salud']];
  const esAdmin = () => yo?.rol === 'admin_plataforma';
  const esGuardia = () => yo?.rol === 'guardia';
  const esClinico = () => yo && !esAdmin() && !esGuardia();
  // Responsables clínicos: editan el plan, leen transcripciones y registran la evaluación de ingreso.
  const esSupervisor = () => yo?.rol === 'supervisor_clinico' || yo?.rol === 'psiquiatra';

  // ── Utilidades ──────────────────────────────────────────────────────────────────
  /** Crea un elemento. Los textos van siempre como textContent: nada de lo que dice una persona se interpreta como HTML. */
  function h(etiqueta, attrs = {}, ...hijos) {
    const el = document.createElement(etiqueta);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (const c of hijos.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
    return el;
  }
  const fecha = (d) => d ? new Date(d).toLocaleDateString('es-CL', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  const fechaHora = (d) => d ? new Date(d).toLocaleString('es-CL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
  const hace = (d) => {
    if (!d) return 'nunca';
    const m = Math.round((Date.now() - new Date(d).getTime()) / 60000);
    if (m < 60) return `hace ${Math.max(m, 1)} min`;
    if (m < 1440) return `hace ${Math.round(m / 60)} h`;
    const dias = Math.round(m / 1440);
    return dias === 1 ? 'ayer' : `hace ${dias} días`;
  };
  const duracion = (a, b) => { if (!b) return 'en curso'; const m = Math.round((new Date(b) - new Date(a)) / 60000); return m < 1 ? 'menos de 1 min' : `${m} min`; };
  const escala = (n) => h('span', { class: 'escala', dataset: { n: String(n ?? 0) }, role: 'img', 'aria-label': `Nivel de riesgo ${n ?? 0} de 3` }, h('i'), h('i'), h('i'), h('i'));
  // Señales y orígenes en palabras: "desesperanza_carga" → "desesperanza carga".
  const senales = (xs) => (xs ?? []).map((x) => x.replaceAll('_', ' ')).join(', ') || '—';
  const FUENTES = { reglas: 'reglas', clasificador: 'clasificador', agente: 'compañero', umbral_personal: 'umbral del plan', sistema: 'sistema' };
  const lineas = (t) => t.split('\n').map((x) => x.trim()).filter(Boolean);

  async function api(metodo, url, cuerpo) {
    const r = await fetch(url, { method: metodo, headers: { authorization: `Bearer ${token}`, ...(cuerpo !== undefined ? { 'content-type': 'application/json' } : {}) }, body: cuerpo !== undefined ? JSON.stringify(cuerpo) : undefined });
    if (r.status === 401) { guardar(null); token = null; mostrarIngreso('Su sesión venció. Ingrese de nuevo.'); throw new Error('Sesión vencida'); }
    const datos = await r.json().catch(() => ({}));
    if (!r.ok) {
      const det = datos.detalle?.[0]?.mensaje;

  /** Abre el diálogo con un formulario; `alEnviar` devuelve false para mantenerlo abierto. */
  function dialogo(titulo, campos, textoBoton, alEnviar, ancho = false) {
    const form = $('dialogo-form');
    $('dialogo').classList.toggle('ancho', ancho);
    const error = h('p', { class: 'error', role: 'alert' });
    form.replaceChildren(h('h2', {}, titulo), ...campos, error,
      h('div', { class: 'acciones' }, textoBoton ? h('button', { class: 'boton', value: 'ok' }, textoBoton) : null, h('button', { class: 'boton sec', value: 'cancelar', formnovalidate: true }, textoBoton ? 'Cancelar' : 'Cerrar')));

  // ── Ingreso ─────────────────────────────────────────────────────────────────────

    try { yo = await api('GET', '/api/yo'); } catch { return; }

        h('div', { class: 'acciones' }, h('button', { class: 'boton sec', value: 'cancelar' }, 'Cerrar')));
      return false;
    });
  }
  const citas = (cs) => cs?.length ? h('span', { class: 'cita' }, ' ', cs.map((c) => `«${c}»`).join(' ')) : null;
  function verInforme(f, s) {
    api('GET', `/api/personas/${f.id}/sesiones/${s.id}/informe`).then(({ informe }) => {
      if (!informe) return alert('El resumen todavía no está listo.');

      if (informe.estado !== 'valido') {
        dialogo('Resumen no validado', [
          h('p', {}, 'El resumen de esta sesión no pasó la verificación y no se muestra, para no presentar datos dudosos. Motivos:'),
          h('ul', {}, (informe.errores ?? []).map((e) => h('li', {}, e))),
          esSupervisor() ? h('p', { class: 'suave' }, 'Puede pedir que se genere de nuevo, o abrir la transcripción con un motivo clínico.') : null,
        ], esSupervisor() ? 'Volver a generar' : null, async () => {
          await api('POST', `/api/personas/${f.id}/sesiones/${s.id}/informe/regenerar`);

        h('div', { class: 'tipo' }, l.tipo === 'lectura' ? `Lectura · se repite en ${l.sesiones_previas.length} sesiones anteriores` : 'Observación de esta sesión', ' · ', l.concepto),
        h('div', {}, l.senalamiento, citas(l.citas))))));

        ...SECCIONES_INFORME.map(seccion),
        i.intervenciones?.length ? [h('h3', {}, 'Intervenciones del compañero y respuesta'), h('ul', {}, i.intervenciones.map((x) => h('li', {}, h('strong', {}, x.tipo), `: ${x.descripcion}`, x.respuesta_persona ? ` Respuesta: ${x.respuesta_persona}` : '', citas(x.citas))))] : null,
        h('h3', {}, 'Para el supervisor'),
        i.observaciones_supervisor?.hipotesis_tentativas?.length ? h('ul', {}, i.observaciones_supervisor.hipotesis_tentativas.map((x) => h('li', { class: 'inferido' }, x.texto, citas(x.citas)))) : h('p', { class: 'suave' }, 'Sin hipótesis.'),
        i.observaciones_supervisor?.temas_pendientes?.length ? h('p', {}, h('strong', {}, 'Retomar: '), i.observaciones_supervisor.temas_pendientes.join('; ')) : null,
        h('h3', {}, 'Lecturas teóricas'),
        h('p', { class: 'nota-lentes' }, 'Hipótesis para el profesional, nunca conclusiones. Cada una cita lo que dijo la persona; una «lectura» exige que el patrón se repita en sesiones anteriores.'),
        lentes.length ? lentes : h('p', { class: 'suave' }, 'Sin material suficiente para lecturas en esta sesión.'),
        h('p', { class: 'nota-lentes', style: 'margin-top:16px' }, `Generado ${fechaHora(informe.generadoEn)}${informe.modelo ? ` con ${informe.modelo}` : ''}. Todas las citas se verificaron contra la transcripción.`),
        esSupervisor() ? h('div', { class: 'acciones' }, h('button', { class: 'boton sec chico', type: 'button', onclick: () => marcarDesvio(f, s) }, 'Marcar desvío del plan')) : null)],

  function marcarDesvio(f, s) {
    dialogo('Marcar desvío del plan', [
      h('p', {}, `Sesión del ${fechaHora(s.inicio)}. Describa en qué se apartó el compañero del plan terapéutico. Queda como dato para mejorar el sistema.`),

  }

  // ── Gráficos (una serie por gráfico; el valor exacto aparece al pasar sobre la marca) ──
  const tooltip = $('tooltip');
  function mostrarTooltip(ev, texto) { tooltip.textContent = texto; tooltip.classList.remove('oculto'); tooltip.style.left = `${ev.clientX + 12}px`; tooltip.style.top = `${ev.clientY - 30}px`; }
  const ocultarTooltip = () => tooltip.classList.add('oculto');
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (etiqueta, attrs = {}, ...hijos) => { const el = document.createElementNS(NS, etiqueta); for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) el.setAttribute(k, v); el.append(...hijos); return el; };
  const etiquetaSemana = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
  /**
   * tipo 'barras' (cantidades) o 'linea' (niveles); `base`: línea base punteada; `formato`: texto del tooltip.
   * Valores nulos no se dibujan (sin dato no es cero).
   */
  function grafico({ titulo, ayuda, semanas, valor, tipo = 'barras', min = 0, max, base = null, formato, sinDatos }) {
    const W = 340, H = 150, izq = 30, abajo = 22, arriba = 8;
    const vals = semanas.map(valor);
    // Sin ningún dato no se dibuja un gráfico vacío: se dice.
    if (vals.every((v) => v === null)) return h('div', { class: 'grafico' }, h('h3', {}, titulo), h('p', {}, sinDatos ?? 'Sin datos en estas semanas.'));
    const tope = max ?? Math.max(1, ...vals.filter((v) => v !== null), base ?? 0);
    const y = (v) => arriba + (H - arriba - abajo) * (1 - (v - min) / (tope - min || 1));
    const paso = (W - izq) / Math.max(semanas.length, 1);
    const x = (i) => izq + paso * i + paso / 2;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${titulo}: ${semanas.map((s, i) => `${etiquetaSemana(s.semana)} ${vals[i] ?? 'sin dato'}`).join(', ')}` });
    for (const v of [min, tope]) svg.append(sv('text', { x: izq - 6, y: y(v) + 4, 'text-anchor': 'end' }, String(Math.round(v * 10) / 10)));
    svg.append(sv('line', { class: 'eje', x1: izq, x2: W, y1: y(min < 0 ? 0 : min), y2: y(min < 0 ? 0 : min) }));
    semanas.forEach((s, i) => { if (i % 2 === semanas.length % 2 || semanas.length <= 4) svg.append(sv('text', { x: x(i), y: H - 6, 'text-anchor': 'middle' }, etiquetaSemana(s.semana))); });
    if (base !== null) {
      svg.append(sv('line', { class: 'base', x1: izq, x2: W, y1: y(base), y2: y(base) }));
      svg.append(sv('text', { x: W, y: y(base) - 4, 'text-anchor': 'end' }, 'línea base'));
    }
    const conTooltip = (el, i) => {
      const enCurso = i === semanas.length - 1 ? ' (semana en curso)' : '';
      const texto = `Semana del ${etiquetaSemana(semanas[i].semana)}${enCurso}: ${vals[i] === null ? 'sin dato' : formato(vals[i], semanas[i])}`;
      el.setAttribute('tabindex', '0');
      el.addEventListener('mousemove', (ev) => mostrarTooltip(ev, texto));
      el.addEventListener('mouseleave', ocultarTooltip);
      el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); mostrarTooltip({ clientX: r.right, clientY: r.top }, texto); });
      el.addEventListener('blur', ocultarTooltip);
      el.append(sv('title', {}, texto));
    };
    if (tipo === 'barras') {
      const ancho = Math.min(22, paso - 6);
      vals.forEach((v, i) => {
        if (v === null) return;
        const alto = Math.max(v > 0 ? 2 : 0, y(min) - y(v));
        const r = sv('rect', { class: 'marca', x: x(i) - ancho / 2, y: y(min) - alto, width: ancho, height: alto, rx: Math.min(4, alto / 2) });
        conTooltip(r, i);
        // Zona de contacto más grande que la barra.
        const zona = sv('rect', { x: x(i) - paso / 2, y: arriba, width: paso, height: H - arriba - abajo, fill: 'transparent' });
        conTooltip(zona, i);
        svg.append(r, zona);
      });
    } else {
      const pts = vals.map((v, i) => (v === null ? null : [x(i), y(v)]));
      let d = '';
      pts.forEach((p, i) => { if (p) d += `${d && pts[i - 1] ? 'L' : 'M'}${p[0]},${p[1]} `; });
      if (d) svg.append(sv('path', { class: 'linea', d }));
      pts.forEach((p, i) => { if (!p) return; const c = sv('circle', { class: 'marca', cx: p[0], cy: p[1], r: 4.5 }); conTooltip(c, i); svg.append(c); });
    }
    return h('div', { class: 'grafico' }, h('h3', {}, titulo), ayuda ? h('p', {}, ayuda) : null, svg);
  }

  async function verAlerta(id, despues) {
    const a = await api('GET', `/api/alertas/${id}`);
    dialogo(`Alerta de nivel ${a.nivel}`, [
      h('p', {}, `${fechaHora(a.creadoEn)} · señales: ${senales(a.categorias)}`),

    ], a.acusadoEn ? null : 'Acusar recibo', async () => {
      await api('POST', `/api/alertas/${id}/acuse`);
      contarAlertas();

  }

        h('tbody', {}, alertas.map((a) => h('tr', { class: a.acusado_en ? null : 'pendiente' },

          h('td', {}, senales(a.categorias)), h('td', { class: 'opcional' }, FUENTES[a.fuente] ?? a.fuente),
          h('td', {}, h('button', { class: a.acusado_en ? 'boton sec chico' : 'boton chico', type: 'button', onclick: () => verAlerta(a.id, pintar) }, a.acusado_en ? 'Ver' : 'Ver y acusar'))))))

    await pintar();

  // ── Equipo (administración) ─────────────────────────────────────────────────────
  async function vistaEquipo(c) {
    const { cuentas } = await api('GET', '/api/cuentas');

      h('td', {}, h('strong', {}, x.nombre), h('br'), h('span', { class: 'suave' }, x.email)), h('td', {}, ROLES[x.rol] ?? x.rol), h('td', { class: 'opcional' }, x.institucion ?? '—'),

      h('td', {}, x.id === yo.id ? null : h('button', { class: x.activa ? 'boton peligro chico' : 'boton sec chico', type: 'button', onclick: async () => {

  }
  function nuevaCuenta() {

      h('div', { class: 'fila' }, h('div', {}, ...campo('u-nombre', 'Nombre', { required: true })), h('div', {}, ...campo('u-email', 'Correo', { type: 'email', required: true }))),
      h('div', { class: 'fila' }, h('div', {}, ...selector('u-rol', 'Rol', ROLES, 'supervisor_clinico')), h('div', {}, ...campo('u-inst', 'Institución', { placeholder: 'CESFAM, universidad…' }))),
      ...campo('u-pass', 'Contraseña inicial', { type: 'password', required: true, minlength: 12, autocomplete: 'new-password' }),
